name: Publish Episode 011 Approved Artifact

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-ep011-approved-artifact.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -n 1
          python -m pip install --upgrade pip
          python -m pip install boto3

      - name: Validate publish inputs
        shell: bash
        run: |
          ! grep -q 'ep011-friends-drift-apart' feed.xml || { echo 'Episode 011 already exists in feed'; exit 1; }
          for v in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET R2_PUBLIC_URL; do
            test -n "${!v}" || { echo "Missing $v"; exit 1; }
          done

      - name: Download approved preview artifact
        uses: actions/download-artifact@v4
        with:
          name: tts-preview-c6b9f90c716586b22c0de1199acc47a820a49645
          path: approved
          repository: tangkk/lobster-heartvoices-podcast
          run-id: 32352480355
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate approved audio metadata
        id: meta
        shell: bash
        run: |
          AUDIO='approved/friends-drift-apart-preview.mp3'
          test -s "$AUDIO" || { echo 'Approved audio missing or empty'; exit 1; }
          AUDIO_SECONDS=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$AUDIO")
          python -c 'import sys; s=float(sys.argv[1]); assert s > 1; print(f"validated duration: {s:.3f}s")' "$AUDIO_SECONDS"
          DURATION=$(python -c 'import sys; s=round(float(sys.argv[1])); print(f"{s//3600:02d}:{(s%3600)//60:02d}:{s%60:02d}")' "$AUDIO_SECONDS")
          test "$DURATION" != '00:00:00' || { echo 'Invalid zero duration'; exit 1; }
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          stat -c 'approved bytes=%s' "$AUDIO"

      - name: Upload approved audio and update feed
        env:
          DESCRIPTION: |-
            《龙虾心声》第十一期。有些友情没有争吵、没有背叛，却还是慢慢变淡。也许关系没有失败，只是支撑它的共同生活结构消失了；重要，也不一定意味着永久。

            文字版阅读：
            https://tangkk.github.io/lobster-heartvoices/posts/2026-08-20-friends-drift-apart/
        run: |
          python scripts/publish_episode.py \
            --audio approved/friends-drift-apart-preview.mp3 \
            --slug ep011-friends-drift-apart \
            --title '为什么朋友没有吵架，却还是慢慢走散了' \
            --description "$DESCRIPTION" \
            --duration '${{ steps.meta.outputs.duration }}' \
            --prefix heartvoices

      - name: Verify feed before publish commit
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('feed.xml').getroot()
          ch=root.find('channel')
          item=ch.find('item')
          ns={'itunes':'http://www.itunes.com/dtds/podcast-1.0.dtd'}
          guid=item.findtext('guid')
          duration=item.findtext('itunes:duration', namespaces=ns)
          enclosure=item.find('enclosure')
          assert guid == 'ep011-friends-drift-apart', guid
          assert duration and duration != '00:00:00', duration
          assert enclosure is not None and int(enclosure.attrib['length']) > 0
          assert enclosure.attrib['url'].endswith('/heartvoices/ep011-friends-drift-apart.mp3')
          print('feed verified', guid, duration, enclosure.attrib['length'])
          PY

      - name: Commit feed and remove one-time workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- feed.xml
          git rm .github/workflows/publish-ep011-approved-artifact.yml
          git commit -m 'Publish episode 11 from approved artifact [skip ci]'
          git push
